<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>reinvention / ancestral drift</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0a0a0a;color:#bdbdb7;font:11px/1.6 'SFMono-Regular',Consolas,'Liberation Mono',monospace}body{overflow:hidden}canvas{position:fixed;inset:0;display:block;width:100%;height:100%}header{position:fixed;z-index:1;top:32px;left:36px;right:36px;display:flex;justify-content:space-between;gap:20px;align-items:baseline}h1{font:inherit;font-weight:400;letter-spacing:1px;margin:0}a{color:#999992;text-decoration:none;min-height:44px;display:flex;align-items:center}a:hover{color:#eeeeea}footer{position:fixed;z-index:1;bottom:24px;left:36px;right:36px;display:flex;align-items:center;justify-content:space-between;gap:20px}footer p{font-size:10px;letter-spacing:.3px;color:#777773;margin:0}button{font:inherit;font-size:10px;letter-spacing:.8px;min-height:44px;min-width:70px;color:#aaa9a3;border:1px solid #292929;background:#0a0a0a;cursor:pointer;padding:8px 13px}button:hover{color:#e3e3db;border-color:#65655f}a:focus-visible,button:focus-visible{outline:1px solid #c4c5af;outline-offset:5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){header{top:18px;left:20px;right:20px;align-items:flex-start}h1{max-width:190px;font-size:10px;padding-top:12px}a{font-size:10px}footer{left:20px;right:20px;bottom:20px}footer p{max-width:210px;font-size:9px}}
</style></head>
<body><canvas id="field" role="img" aria-label="a pale radial organism slowly reinvents itself, with faint silhouettes of its ancestors lingering behind"></canvas><header><h1>reinvention / ancestral drift</h1><a href="../index.html" aria-label="back to all experiments">← all studies</a></header><footer><p>what remains when change never stops?</p><button id="pause" type="button">pause</button></footer><span id="motion-status" class="sr-only" role="status"></span>
<script>
'use strict';
const SAMPLE_COUNT=160, MUTATION_COUNT=20, CADENCE=3200, TRANSITION=1250, MEMORY=5;
const TAU=Math.PI*2;
function hash(value){let v=value|0;v=Math.imul(v^(v>>>16),0x45d9f3b);v=Math.imul(v^(v>>>16),0x45d9f3b);return (v^(v>>>16))>>>0}
function sample(state,index){return state[(index%SAMPLE_COUNT+SAMPLE_COUNT)%SAMPLE_COUNT]}
function bounded(value){return Math.max(.42,Math.min(.98,value))}
function origin(){return Array.from({length:SAMPLE_COUNT},(_,i)=>.74+.095*Math.cos(i/SAMPLE_COUNT*TAU*3)+.042*Math.sin(i/SAMPLE_COUNT*TAU*7))}
const RULES=[
{name:'displace',apply:(s,i,p)=>sample(s,i-7-p%9)},
{name:'fold',apply:(s,i,p)=>sample(s,p%SAMPLE_COUNT-i)},
{name:'swell',apply:(s,i,p)=>sample(s,i)+.10*Math.sin(i/SAMPLE_COUNT*TAU*3+p*.013)},
{name:'gather',apply:(s,i,p)=>.55*sample(s,i)+.30*sample(s,i-3)+.15*sample(s,i+5)},
{name:'counterform',apply:(s,i,p)=>1.40-sample(s,i)},
{name:'ripple',apply:(s,i,p)=>.82*sample(s,i)+.18*(.71+.18*Math.sin(i/SAMPLE_COUNT*TAU*5+p*.021))}
];
function nextState(parent,generation){const rule=(generation-1)%RULES.length,phase=hash(generation*41+919),start=hash(generation*73+11)%SAMPLE_COUNT,cells=parent.slice();for(let k=0;k<MUTATION_COUNT;k++){const i=(start+k)%SAMPLE_COUNT;cells[i]=bounded(RULES[rule].apply(parent,i,phase))}return {cells,rule,start}}
const state={generation:0,cells:origin(),ancestors:[],rule:-1,start:0};
function advance(){const next=nextState(state.cells,state.generation+1);state.ancestors.unshift(state.cells);if(state.ancestors.length>MEMORY)state.ancestors.pop();Object.assign(state,next);state.generation++}
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),pauseButton=document.getElementById('pause');
const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');
let paused=motionPreference.matches,elapsed=0,previousTime=null,frameId=null,lastPaint=-Infinity,width=0,height=0,mobile=false;
function resize(){width=innerWidth;height=innerHeight;mobile=width<=600;const density=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*density);canvas.height=Math.round(height*density);ctx.setTransform(density,0,0,density,0,0);draw()}
function layer(cells,age,opacity,present){if(opacity<=0)return;const radius=Math.min(width*.43,height*.37,340),cx=width/2-age*radius*.024,cy=height/2+14-age*radius*.016,scale=1+age*.018;ctx.lineWidth=present?1:.7;ctx.strokeStyle=present?'#d9dcd0':'#919788';ctx.globalAlpha=opacity;const shells=present?7:3;for(let shell=0;shell<shells;shell++){const fraction=present?.32+shell*.112:.48+shell*.24;ctx.beginPath();for(let i=0;i<SAMPLE_COUNT;i++){const angle=i/SAMPLE_COUNT*TAU-Math.PI/2,radiusAt=cells[i]*radius*scale*fraction;const length=present?(shell===6?5.2:2.4):1.7;const x=cx+Math.cos(angle)*radiusAt,y=cy+Math.sin(angle)*radiusAt;ctx.moveTo(x-Math.cos(angle)*length/2,y-Math.sin(angle)*length/2);ctx.lineTo(x+Math.cos(angle)*length/2,y+Math.sin(angle)*length/2)}ctx.stroke()}if(present){ctx.globalAlpha=opacity*.24;ctx.beginPath();for(let i=0;i<SAMPLE_COUNT;i++){if(i%4)continue;const angle=i/SAMPLE_COUNT*TAU-Math.PI/2,r=cells[i]*radius;ctx.moveTo(cx+Math.cos(angle)*r*.34,cy+Math.sin(angle)*r*.34);ctx.lineTo(cx+Math.cos(angle)*r*.985,cy+Math.sin(angle)*r*.985)}ctx.stroke()}ctx.globalAlpha=1}
function draw(){ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,width,height);const blend=state.generation?Math.min(1,elapsed/TRANSITION):1,visible=mobile?2:MEMORY;for(let index=Math.min(visible,state.ancestors.length)-1;index>=0;index--)layer(state.ancestors[index],index+1,.16*(1-index/(MEMORY+1)),false);if(state.generation&&blend<1)layer(state.ancestors[0],0,1-blend,true);layer(state.cells,0,blend,true)}
function frame(now){frameId=null;if(paused||document.hidden){previousTime=null;return}if(previousTime!==null)elapsed+=Math.min(250,Math.max(0,now-previousTime));previousTime=now;let advanced=false;while(elapsed>=CADENCE){elapsed-=CADENCE;advance();advanced=true}if(now-lastPaint>=1000/30&&(advanced||elapsed<TRANSITION+50)){draw();lastPaint=now}frameId=requestAnimationFrame(frame)}
function schedule(){if(frameId===null&&!paused&&!document.hidden){previousTime=null;frameId=requestAnimationFrame(frame)}}
function stop(){if(frameId!==null)cancelAnimationFrame(frameId);frameId=null;previousTime=null}
function updateButton(){pauseButton.textContent=paused?'resume':'pause';pauseButton.setAttribute('aria-label',paused?'resume ancestral drift':'pause ancestral drift');document.getElementById('motion-status').textContent=paused?'animation paused':'animation running'}
pauseButton.addEventListener('click',()=>{paused=!paused;updateButton();if(paused)stop();else schedule()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else schedule()});
motionPreference.addEventListener('change',event=>{if(event.matches){paused=true;stop();updateButton()}});
addEventListener('resize',resize);
Object.defineProperty(window,'ancestralDrift',{value:Object.freeze({snapshot:()=>({generation:state.generation,rule:state.rule<0?'origin':RULES[state.rule].name,cells:state.cells.slice(),ancestors:state.ancestors.map(cells=>cells.slice()),inheritance:.875,cadence:CADENCE,elapsed,paused,visibleAncestors:mobile?2:MEMORY}),model:Object.freeze({origin,nextState,samples:SAMPLE_COUNT,mutations:MUTATION_COUNT,rules:Object.freeze(RULES.map(rule=>rule.name))})}),writable:false});
updateButton();resize();schedule();
</script></body></html>
