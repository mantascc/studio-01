<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topology / Same Dots</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0a0a0a;overflow:hidden}
body{font:11px/1.7 'SFMono-Regular',ui-monospace,Consolas,monospace;color:#989898}
canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
header{position:fixed;top:24px;left:32px;right:32px;display:flex;align-items:start;justify-content:space-between;gap:20px;pointer-events:none}
h1{font:inherit;font-size:12px;font-weight:400;letter-spacing:1px;margin:0;color:#bbb}
a,button{pointer-events:auto;color:#929292;text-decoration:none}a{display:inline-block;padding:6px 0}
.controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{border:1px solid #333;background:#0a0a0a;padding:8px 12px;min-height:40px;font:inherit;cursor:pointer}
button:hover,a:hover{color:#fff}button[aria-pressed=true].formation{color:#0a0a0a;background:#c4c5af;border-color:#c4c5af}
a:focus-visible,button:focus-visible{outline:1px solid #d8ded1;outline-offset:3px}
.strip{position:fixed;left:32px;right:32px;bottom:22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cell{border:1px solid #1f1f1f;background:#0a0a0a;padding:8px 8px 6px;min-height:0;text-align:left;display:block;color:#777}
.cell canvas{display:block;width:100%;height:46px}
.cell .name{display:flex;justify-content:space-between;gap:6px;font-size:10px;letter-spacing:.5px}
.cell .m{font-size:9px;color:#5d5d5d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell[aria-pressed=true]{border-color:#c4c5af;color:#d6d6d0}.cell[aria-pressed=true] .m{color:#9a9b8a}
.note{position:fixed;left:32px;font-size:10px;letter-spacing:1px;pointer-events:none;color:#686868}
@media(max-width:700px){header{top:16px;left:16px;right:16px;flex-direction:column;gap:8px}.controls{justify-content:flex-start}button{padding:6px 9px;min-height:36px}
.strip{left:16px;right:16px;bottom:14px;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.cell{padding:5px 4px 4px}.cell canvas{height:34px}.cell .m{display:none}.cell .name span:last-child{display:none}.note .long{display:none}.note{left:16px}}
</style></head><body>
<canvas id="field" aria-label="Five dots with fixed lenses receive the same brief. Only the connections between them change. Needles show each dot's current reading; the ring shows what the formation outputs."></canvas>
<header>
 <div><h1>topology / same dots</h1><a href="../index.html">← sketches</a></div>
 <div class="controls" role="toolbar" aria-label="formation and playback">
  <span id="formations" class="controls"></span>
  <button id="brief" type="button" title="new brief (N)">new brief</button>
  <button id="pause" type="button" aria-pressed="false">pause</button>
 </div>
</header>
<div class="note" id="note">same dots · same rule · same brief<span class="long"> — only the edges change</span></div>
<div class="strip" id="strip" aria-label="Output of each formation for the current brief, as deviation from the brief over 24 rounds"></div>
<script>
'use strict';
// ---------- model (pure, deterministic) ----------
const ALPHA=.55, BETA=.2, ROUNDS=24, ROUND_SEC=.5, DT=1/60, SETTLE_DEG=.5;
const RAD=Math.PI/180, IDS=['A','B','C','D','E'];
const LENS=[-60,-20,15,50,100].map(d=>d*RAD);           // fixed point of view per dot: capability held constant
const lensVec=LENS.map(a=>[Math.cos(a),Math.sin(a)]);
const FORMATIONS={
 council:{label:'council',entry:[0,1,2,3,4],output:'mean',edges:[],
  pos:[0,1,2,3,4].map(i=>{const a=-Math.PI/2+i*2*Math.PI/5;return[Math.cos(a)*.66,Math.sin(a)*.66]})},
 makercritic:{label:'maker–critic',entry:[0,2],output:4,edges:[[0,1],[1,0],[2,3],[3,2],[1,4],[3,4]],
  pos:[[-.62,-.42],[-.62,.42],[.02,-.42],[.02,.42],[.66,0]]},
 pipeline:{label:'pipeline',entry:[0],output:4,edges:[[0,1],[1,2],[2,3],[3,4]],
  pos:[[-.8,.14],[-.4,-.14],[0,.14],[.4,-.14],[.8,.14]]},
 star:{label:'star',entry:[0],output:0,edges:[[0,1],[1,0],[0,2],[2,0],[0,3],[3,0],[0,4],[4,0]],
  pos:[[0,0],[-.6,-.55],[.6,-.55],[.6,.55],[-.6,.55]]},
 network:{label:'network',entry:[0],output:'mean',edges:[[0,1],[1,0],[1,2],[2,1],[2,3],[3,2],[3,4],[4,3],[4,0],[0,4],[0,2],[2,0]],
  pos:[0,1,2,3,4].map(i=>{const a=-Math.PI/2+i*2*Math.PI/5;return[Math.cos(a)*.66,Math.sin(a)*.66]})}
};
const ORDER=['council','makercritic','pipeline','star','network'];
const norm=v=>{const l=Math.hypot(v[0],v[1]);return l<1e-9?null:[v[0]/l,v[1]/l]};
const ang=v=>Math.atan2(v[1],v[0]);
const diff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
function meanVec(list){let x=0,y=0;for(const v of list){x+=v[0];y+=v[1]}return list.length?norm([x/list.length,y/list.length]):null}
function outputOf(f,est){return f.output==='mean'?meanVec(est):est[f.output]}
function stepRound(f,est,brief){
 const inc=IDS.map(()=>[]);for(const[a,b]of f.edges)inc[b].push(est[a]);for(const i of f.entry)inc[i].push(brief);
 return est.map((v,i)=>{if(!inc[i].length)return v;const m=meanVec(inc[i])||v;
  return norm([v[0]+ALPHA*(m[0]-v[0])+BETA*(lensVec[i][0]-v[0]),v[1]+ALPHA*(m[1]-v[1])+BETA*(lensVec[i][1]-v[1])])||v})}
function runHeadless(key,briefAngle){
 const f=FORMATIONS[key],brief=[Math.cos(briefAngle),Math.sin(briefAngle)];let est=lensVec.map(v=>[...v]);
 const trace=[diff(ang(outputOf(f,est)),briefAngle)],states=[est];
 for(let r=0;r<ROUNDS;r++){est=stepRound(f,est,brief);states.push(est);trace.push(diff(ang(outputOf(f,est)),briefAngle))}
 let settle=ROUNDS;for(let r=ROUNDS;r>=1;r--){if(Math.abs(diff(trace[r],trace[r-1]))>SETTLE_DEG*RAD)break;settle=r-1}
 const m=meanVec(est),spread=est.reduce((s,v)=>s+Math.abs(diff(ang(v),ang(m))),0)/5;
 const conflict=f.edges.length?f.edges.reduce((s,[a,b])=>s+Math.abs(diff(ang(est[a]),ang(est[b]))),0)/f.edges.length:0;
 let wander=0;for(let r=1;r<=ROUNDS;r++)wander+=Math.abs(diff(trace[r],trace[r-1]));
 return{key,trace,states,drift:trace[ROUNDS],settle,spread,conflict,wander}}
// ---------- seeded briefs ----------
let seed=101703;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
const nextBrief=()=>(-150+rnd()*300)*RAD;
// ---------- state ----------
const media=matchMedia('(prefers-reduced-motion: reduce)');
let active='pipeline',briefAngle=nextBrief(),runs={},clock=0,paused=false,last=null,acc=0,morph=1,fromPos=null,history=[];
function computeAll(){runs={};for(const k of ORDER)runs[k]=runHeadless(k,briefAngle)}
function pos(i){const to=FORMATIONS[active].pos[i];if(!fromPos||morph>=1)return to;const e=morph<.5?2*morph*morph:1-Math.pow(-2*morph+2,2)/2;return[fromPos[i][0]+(to[0]-fromPos[i][0])*e,fromPos[i][1]+(to[1]-fromPos[i][1])*e]}
function round(){return Math.min(ROUNDS,Math.floor(clock/ROUND_SEC))}
function select(key){if(key===active&&clock===0)return;fromPos=IDS.map((_,i)=>pos(i));active=key;morph=media.matches?1:0;clock=0;history.push(key);if(history.length>16)history.shift();syncUI()}
function newBrief(){briefAngle=nextBrief();computeAll();clock=0;syncUI()}
// ---------- DOM ----------
const field=document.querySelector('#field'),ctx=field.getContext('2d'),fbox=document.querySelector('#formations'),strip=document.querySelector('#strip'),pauseBtn=document.querySelector('#pause'),note=document.querySelector('#note');
const fButtons={},cells={};
ORDER.forEach((k,n)=>{const b=document.createElement('button');b.type='button';b.className='formation';b.textContent=FORMATIONS[k].label;b.title=`${FORMATIONS[k].label} (${n+1})`;b.onclick=()=>select(k);fbox.append(b);fButtons[k]=b;
 const c=document.createElement('button');c.type='button';c.className='cell';c.innerHTML=`<div class="name"><span>${FORMATIONS[k].label}</span><span></span></div><canvas></canvas><div class="m"></div>`;c.onclick=()=>select(k);strip.append(c);cells[k]=c});
document.querySelector('#brief').onclick=newBrief;
pauseBtn.onclick=()=>{paused=!paused;last=null;acc=0;syncUI()};
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&e.key===' ')return;const n=+e.key;if(n>=1&&n<=5){select(ORDER[n-1])}else if(e.key==='n'||e.key==='N'){newBrief()}else if(e.key===' '){e.preventDefault();paused=!paused;syncUI()}});
document.addEventListener('visibilitychange',()=>{last=null;acc=0});
const deg=r=>`${r>=0?'+':'−'}${Math.abs(r/RAD).toFixed(0)}°`;
function syncUI(){for(const k of ORDER){fButtons[k].setAttribute('aria-pressed',String(k===active));cells[k].setAttribute('aria-pressed',String(k===active));const r=runs[k];
  cells[k].querySelector('.name span:last-child').textContent=`drift ${deg(r.drift)}`;
  cells[k].querySelector('.m').textContent=`settle ${r.settle} · spread ${(r.spread/RAD).toFixed(0)}° · conflict ${(r.conflict/RAD).toFixed(0)}°`}
 pauseBtn.textContent=paused?'resume':'pause';pauseBtn.setAttribute('aria-pressed',String(paused));layout()}
// ---------- render ----------
let W=0,H=0,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);field.width=Math.round(W*dpr);field.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
 for(const k of ORDER){const cv=cells[k].querySelector('canvas'),r=cv.getBoundingClientRect();cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr))}
 layout()}
function layout(){const sb=strip.getBoundingClientRect().top;note.style.top=`${sb-24}px`;drawStrip()}
function frameBox(){const top=document.querySelector('header').getBoundingClientRect().bottom+18,bottom=strip.getBoundingClientRect().top-34;const cx=W/2,cy=(top+bottom)/2,s=Math.max(60,Math.min(W*.42,(bottom-top)/2*.92));return{cx,cy,s}}
function drawStrip(){if(!runs[active])return;const r=round();for(const k of ORDER){const cv=cells[k].querySelector('canvas'),c=cv.getContext('2d'),w=cv.width,h=cv.height,run=runs[k],on=k===active;
 c.clearRect(0,0,w,h);c.strokeStyle='#2a2a2a';c.lineWidth=dpr;c.setLineDash([2*dpr,3*dpr]);c.beginPath();c.moveTo(0,h/2);c.lineTo(w,h/2);c.stroke();c.setLineDash([]);
 const y=v=>h/2-Math.max(-1,Math.min(1,v/(60*RAD)))*(h/2-2*dpr),x=i=>i/ROUNDS*(w-2*dpr)+dpr;
 c.strokeStyle=on?'#c4c5af':'#5a5b52';c.lineWidth=(on?1.4:1)*dpr;c.beginPath();run.trace.forEach((v,i)=>i?c.lineTo(x(i),y(v)):c.moveTo(x(i),y(v)));c.stroke();
 if(on){c.fillStyle='#f0f0e8';c.beginPath();c.arc(x(r),y(run.trace[r]),2.2*dpr,0,7);c.fill()}}}
function needle(x,y,a,len,col,w,dash){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*len,y+Math.sin(a)*len);ctx.stroke();ctx.setLineDash([])}
function render(){
 ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);const f=FORMATIONS[active],run=runs[active],r=round(),phase=(clock%ROUND_SEC)/ROUND_SEC,{cx,cy,s}=frameBox();
 const P=IDS.map((_,i)=>{const p=pos(i);return[cx+p[0]*s,cy+p[1]*s]});const est=run.states[r],nxt=run.states[Math.min(ROUNDS,r+1)];
 const live=est.map((v,i)=>{const a=ang(v),b=ang(nxt[i]);return a+diff(b,a)*(r<ROUNDS?phase:0)});
 const edgeAlpha=morph<1?morph:1, moving=r<ROUNDS&&!media.matches;
 // brief source
 const bx=Math.max(24,cx-s*1.18),by=cy;ctx.fillStyle='#666';ctx.font='10px ui-monospace,monospace';ctx.fillText('brief',bx-14,by-26);
 needle(bx,by,briefAngle,22,'#d6d6d0',1.4);ctx.fillStyle='#d6d6d0';ctx.fillRect(bx-2,by-2,4,4);
 for(const i of f.entry){ctx.strokeStyle=`rgba(196,197,175,${.16*edgeAlpha})`;ctx.lineWidth=1;ctx.setLineDash([2,4]);ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(...P[i]);ctx.stroke();ctx.setLineDash([]);
  if(moving){ctx.fillStyle=`rgba(214,214,208,${.55*edgeAlpha})`;ctx.beginPath();ctx.arc(bx+(P[i][0]-bx)*phase,by+(P[i][1]-by)*phase,1.6,0,7);ctx.fill()}}
 // output anchor
 const out=f.output==='mean'?[cx,cy]:P[f.output];
 if(f.output==='mean'){for(let i=0;i<5;i++){ctx.strokeStyle=`rgba(120,120,110,${.22*edgeAlpha})`;ctx.lineWidth=1;ctx.setLineDash([1,4]);ctx.beginPath();ctx.moveTo(...P[i]);ctx.lineTo(...out);ctx.stroke();ctx.setLineDash([])}}
 // edges: brightness = disagreement between endpoints
 for(const[a,b]of f.edges){const d=Math.abs(diff(live[a],live[b]))/Math.PI,x1=P[a][0],y1=P[a][1],x2=P[b][0],y2=P[b][1];
  const twin=f.edges.some(([p,q])=>p===b&&q===a),nx=-(y2-y1),ny=x2-x1,l=Math.hypot(nx,ny)||1,o=twin?4:0,ox=nx/l*o,oy=ny/l*o;
  ctx.strokeStyle=`rgba(${150+d*90|0},${150+d*30|0},${140},${(.18+d*.7)*edgeAlpha})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1+ox,y1+oy);ctx.lineTo(x2+ox,y2+oy);ctx.stroke();
  const t=.82,hx=x1+ox+(x2-x1)*t,hy=y1+oy+(y2-y1)*t,ea=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx-Math.cos(ea-.45)*5,hy-Math.sin(ea-.45)*5);ctx.moveTo(hx,hy);ctx.lineTo(hx-Math.cos(ea+.45)*5,hy-Math.sin(ea+.45)*5);ctx.stroke();
  if(moving){ctx.fillStyle=`rgba(214,214,208,${.75*edgeAlpha})`;ctx.beginPath();ctx.arc(x1+ox+(x2-x1)*phase,y1+oy+(y2-y1)*phase,1.6,0,7);ctx.fill()}}
 // dots
 for(let i=0;i<5;i++){const[x,y]=P[i],isEntry=f.entry.includes(i);
  ctx.strokeStyle='#4a4a44';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,30,LENS[i]-.12,LENS[i]+.12);ctx.stroke();      // lens tick
  needle(x,y,LENS[i],30,'rgba(140,140,130,.35)',1,[1,3]);
  needle(x,y,live[i],26,'#c4c5af',1.5);
  ctx.fillStyle=isEntry?'#d6d6d0':'#0a0a0a';ctx.strokeStyle='#c4c5af';ctx.lineWidth=1;ctx.fillRect(x-5,y-5,10,10);ctx.strokeRect(x-5.5,y-5.5,11,11);
  ctx.fillStyle='#8a8a80';ctx.font='10px ui-monospace,monospace';ctx.fillText(IDS[i],x+9,y+16)}
 // output ring: formation reading vs brief
 const oa=ang(outputOf(f,live.map(a=>[Math.cos(a),Math.sin(a)]))||[1,0]);
 ctx.strokeStyle='#f0f0e8';ctx.lineWidth=1;ctx.beginPath();ctx.arc(out[0],out[1],f.output==='mean'?14:18,0,7);ctx.stroke();
 needle(out[0],out[1],briefAngle,44,'rgba(214,214,208,.4)',1,[3,3]);needle(out[0],out[1],oa,44,'#f0f0e8',1.6);
 ctx.fillStyle='#777';ctx.font='10px ui-monospace,monospace';const lbl=`out ${deg(diff(oa,briefAngle))} · round ${String(r).padStart(2,'0')}/${ROUNDS}`;ctx.fillText(lbl,Math.max(12,Math.min(W-ctx.measureText(lbl).width-12,out[0]-ctx.measureText(lbl).width/2)),out[1]+(f.output==='mean'?32:38));
}
function frame(now){if(last!==null&&!paused&&!document.hidden){acc+=Math.min((now-last)/1000,.1);while(acc>=DT){acc-=DT;if(morph<1){morph=Math.min(1,morph+DT/.9)}else if(clock<ROUNDS*ROUND_SEC){const before=round();clock=Math.min(ROUNDS*ROUND_SEC,clock+DT);if(round()!==before)drawStrip()}}}last=now;render();requestAnimationFrame(frame)}
Object.defineProperty(window,'sameDots',{value:Object.freeze({
 snapshot:()=>({active,briefDeg:briefAngle/RAD,round:round(),paused,morph,history:[...history],
  runs:Object.fromEntries(ORDER.map(k=>[k,{driftDeg:runs[k].drift/RAD,settle:runs[k].settle,spreadDeg:runs[k].spread/RAD,conflictDeg:runs[k].conflict/RAD,wanderDeg:runs[k].wander/RAD}])),
  constants:{alpha:ALPHA,beta:BETA,rounds:ROUNDS,roundSec:ROUND_SEC,lensDeg:LENS.map(a=>a/RAD)}}),
 run:(key,briefDeg)=>{const r=runHeadless(key,briefDeg*RAD);return{driftDeg:r.drift/RAD,settle:r.settle,spreadDeg:r.spread/RAD,conflictDeg:r.conflict/RAD,trace:r.trace.map(v=>v/RAD)}}
}),writable:false});
computeAll();resize();syncUI();addEventListener('resize',resize);requestAnimationFrame(frame);
</script></body></html>
